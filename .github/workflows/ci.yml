name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Formatting
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on these files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test -count=1 ./...
      - name: Build
        run: go build -o jev-check .
      - name: CLI smoke
        run: |
          ./jev-check --help
          mkdir -p .jev-check && ln -s ../.jev-check-example/config.json ../.jev-check-example/input ../.jev-check-example/fixtures .jev-check/
          ./jev-check list
          ./jev-check ask example --dry-run
          ./jev-check context .
      - name: Install script
        run: sh -n install.sh
      - name: No tracked file changed
        run: git diff HEAD --exit-code
